[project]
name = "complete-journey"
version = "0.1.0"
description = "Reproduction code for Andreyev (2026), Heterogeneity, Latent State or Purchase History?"
authors = [{ name = "Artyom Andreyev" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "matplotlib>=3.8",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "linearmodels>=6.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "scikit-learn>=1.5,<2",
]

[project.urls]
Repository = "https://github.com/rtmandreyev/shopping-persistence-reproduction"

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complete_journey"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = [
    "E501",  # line length handled by the formatter
    "B008",  # DuckDB/argparse-style calls in scripts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
]
